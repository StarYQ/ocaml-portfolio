name: Update opam lock

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update-lock:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up OCaml
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: 5.1.1

      - name: Install OCaml dependencies
        run: opam install . --deps-only

      - name: Lock dependencies
        run: opam lock .

      - name: Build
        run: opam exec -- make build-prod

      - name: Create pull request
        uses: peter-evans/create-pull-request@v8
        with:
          branch: update-opam-lock
          title: 'chore: update opam lock file'
          commit-message: 'chore: update opam lock file'
          body: Fresh opam resolve on ubuntu-latest, verified with make build-prod
          add-paths: ocaml_portfolio.opam.locked
          delete-branch: true
