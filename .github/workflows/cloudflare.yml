name: Deploy to Cloudflare Workers

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - preview

permissions:
  contents: read
  deployments: write

concurrency:
  group: "cloudflare-deployment"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    name: Build and Deploy to Cloudflare Workers
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # Restored before setup-ocaml (cache: false) so it reuses the switch instead of rebuilding it
      - name: Cache opam switch
        id: opam-cache
        uses: actions/cache@v6
        with:
          path: |
            ~/.opam
            _opam
          key: opam-${{ runner.os }}-${{ hashFiles('ocaml_portfolio.opam.locked') }}

      - name: Set up OCaml
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: 5.1.1
          cache: false

      # libev-dev is needed to link lwt even when the switch is restored
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y m4 pkg-config libgmp-dev libev-dev

      - name: Install OCaml dependencies
        if: steps.opam-cache.outputs.cache-hit != 'true'
        run: opam install . --deps-only --locked

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install Node dependencies
        run: npm ci --include=dev

      - name: Build
        run: opam exec -- npm run build:worker

      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN is not configured"
            exit 1
          fi
          if [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
            echo "::error::CLOUDFLARE_ACCOUNT_ID is not configured"
            exit 1
          fi
          npx --no-install wrangler deploy --env "${{ github.event.inputs.environment || 'production' }}"

      - name: Create GitHub deployment
        uses: actions/github-script@v8
        with:
          script: |
            const environment = '${{ github.event.inputs.environment || 'production' }}';
            const url = environment === 'production'
              ? 'https://arnabb.dev'
              : 'https://ocaml-portfolio-preview.workers.dev';

            const deployment = await github.rest.repos.createDeployment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: context.sha,
              environment: environment,
              description: 'Cloudflare Workers deployment',
              auto_merge: false,
              required_contexts: [],
              production_environment: environment === 'production'
            });

            await github.rest.repos.createDeploymentStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              deployment_id: deployment.data.id,
              state: 'success',
              environment_url: url,
              description: 'Deployment successful'
            });
